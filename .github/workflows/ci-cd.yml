name: CI/CD

# ทุกครั้งที่ push ขึ้น main → typecheck/build → build Docker image → push ขึ้น Docker Hub
on:
  push:
    branches: [main]
  workflow_dispatch: # กดรันเองได้จากหน้า Actions

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # CI: typecheck + compile (tsc && tsc-alias) — พังตรงนี้จะไม่ push image
      - name: Build (typecheck)
        run: pnpm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # CD: build image จาก Dockerfile แล้ว push ทับ :latest
      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: xielnwza/preflight-backend:latest
